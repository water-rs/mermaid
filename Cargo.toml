[workspace]
resolver = "2"

[package]
name = "waterui-mermaid"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/mermaid"
description = "Mermaid diagram component for WaterUI, drawn through Scene2D"
keywords = ["mermaid", "diagram", "flowchart", "waterui"]
categories = ["gui", "visualization"]
# `merman-core` / `merman-render` are consumed from the water-rs/merman fork
# (git, below) until upstream releases the typed layout projection; crates.io
# refuses git-only dependencies, so this crate cannot be published yet and
# release-plz must not run `cargo publish` for it (water-rs/waterui#533).
publish = false

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }

[dependencies]
waterui-core = "0.5.1"
# `default-features = false` keeps canvas's `image` feature off: a diagram
# draws only vector paths and text, never a decoded raster, so the `gpu`
# engine `image` asks `waterui-graphics` for is not part of this build.
waterui-canvas = { version = "0.2.0", default-features = false }
waterui-graphics = { version = "0.5.1", default-features = false }
waterui-layout = "0.5.1"
# `system-fonts` is what lets a host with no font stack of its own — the native
# Apple, Android and GTK backends — install a collection at all. A diagram is
# measured from real faces, so a build carrying this component must be able to
# reach them.
waterui-text = { version = "0.5.1", features = ["system-fonts"] }
nami = "0.12"
# Mermaid parsing, semantic model and diagram layout. Consumed from our fork
# while `typed-layout-projection` is unreleased upstream: `merman-render`'s only
# public exit from the layout stage is `layout_json`, whose `#[serde(skip)]`
# fields drop geometry a self-drawing host needs — a sequence diagram's
# loop/alt fragment boxes among them. The branch makes the typed projection
# public and changes nothing else. See water-rs/waterui#217.
merman-core = { git = "https://github.com/water-rs/merman", rev = "a6f41d47b497c05844003a0e765a3cf78df6678d" }
merman-render = { git = "https://github.com/water-rs/merman", rev = "a6f41d47b497c05844003a0e765a3cf78df6678d", default-features = false }
# Only to read Mermaid's own `fontSize` out of the effective config, which
# `merman-core` exposes as a JSON value.
serde_json = "1.0"
# The host text measurement `merman-render` lays diagrams out with. The faces
# come from the application's shared `FontCollection`, which this crate only
# reads: `parley` is here for the shaping the collection is handed to, not to
# discover fonts.
parley = { version = "0.11", default-features = false, features = ["std"] }
thiserror = "2.0.20"

[dev-dependencies]
# The tests mount real Markdown, so they need the Markdown stack on top of the
# `highlight` feature the library half selects.
waterui = { version = "0.5.2", features = ["flow-markdown"] }
waterui-testing = "0.5.1"
hydrolysis-m3 = "0.3.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package.metadata.cargo-machete]
# The crate-level example is a doctest, and doctests are the one place
# `cargo machete` does not look. `waterui` is what its `use waterui::prelude::*`
# resolves against.
ignored = ["waterui"]

# The WaterUI packages above declare crates.io requirements so this manifest
# keeps the shape a published crate needs; `[patch.crates-io]` redirects every
# one of them to the framework head the port builds against — the same shape
# the other split components carry while the recording contract is unreleased.
[patch.crates-io]
# The framework head the port builds against: water-rs/waterui `dev` at
# ec09f64738, carrying the render-target-neutral recording contract
# (water-rs/waterui#1435): `SceneContent::build_scene` records into
# `waterui_graphics::draw` (`cherenkov_record::Recorder`) and
# `SceneResources::new` takes the target's `SceneBackend`/`ShaderBackend`
# registry instead of `Rc<Engine<B>>`. Every `waterui-*` crate in the graph
# must resolve to this one rev — a registry `waterui-core` beside the facade's
# own sources gives two `View` traits in one graph.
waterui = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }

# Extracted component crates this graph pulls, at their current `dev` heads.
waterui-canvas = { git = "https://github.com/water-rs/canvas", rev = "639957374ed6eac16ac410249b6ba7d9f06c3978" }
waterui-image = { git = "https://github.com/water-rs/image", rev = "8b1aa2ce3f03d81ca02164f5563f2cefc34fb566" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "16f99e021f735d0b1b31c95552b074e953d56418" }

# The mounted test graph's backend pair: `hydrolysis` lives in-tree at
# `backends/hydrolysis` (water-rs/waterui#1428), so it resolves from the same
# framework revision as every `waterui-*` crate; its Material 3 theme is
# external and rides the same `dev`-head wave as the other components.
hydrolysis = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "bc412a1a7e796cedc30d2c62d33fe293634574a8" }

# The Cherenkov family lives in-tree under `graphics/` (water-rs/waterui#1449).
# `hydrolysis-m3` and `waterui-svg` declare `cherenkov` as a crates.io
# requirement (`0.0.0`, unpublished), so it resolves to the in-tree sources;
# the rest of the family rides the same revision — a filter type built on the
# published `filtrate` is a different type from one built in-tree.
cherenkov = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
filtrate = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
filtrate-core = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }

# Every waterkit crate the codec graph shares types across rides the same rev
# — a registry `waterkit-core` beside the pinned `waterkit-codec` gives two
# decoder types. The rev is the one the framework's own patch table pins.
waterkit-build = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }

# codec asks for shaderloom's `runtime` feature, added after the 0.1.2 registry
# release — pin the same rev as the framework's own table.
shaderloom = { git = "https://github.com/water-rs/shaderloom", rev = "b0b6870c8b560d902c1de9a4d039c3a921b18b92" }

# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). The fork carries only that backport on the
# v30.0.1 tag; drop these entries once wgpu-hal 30.0.2 ships it.
naga = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }

# suiteki 0.1.1 on crates.io implements nami-core 0.3's `Signal`; suiteki dev
# at the merge of water-rs/suiteki#27 implements 0.4's. Drop once a release
# carries it.
suiteki = { git = "https://github.com/water-rs/suiteki", rev = "7cf17bdba0e978d388a096b1916daebdc17253b4" }
