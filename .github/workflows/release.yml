name: Release

# Every push to `main` runs both jobs: `release` creates the changelog, tag,
# and GitHub release (publishing is disabled in `release-plz.toml`, and the
# required `CI result` check on `main` already guarantees the merged commit
# passed CI), and `release-pr` opens or refreshes the version bump and
# changelog pull request against `main`. Merging that pull request is the
# release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    name: Release unpublished packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # `publish = false` in release-plz.toml: the merman dependencies are
      # git-only, so crates.io cannot take this crate. There is no `cargo
      # publish` and no OIDC token minting — the job cuts the changelog, tag
      # and GitHub release only.
      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    name: Prepare the next release
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub holds the pull request runs of a pull request the Actions bot
      # opened or pushed until they are approved, and the required
      # `CI result` reports only from those runs.
      - name: Approve the release PR's CI
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: bash .github/scripts/approve-held-runs.sh "$(jq -er .number <<<"$PR")"
